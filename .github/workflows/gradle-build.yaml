name: Gradle Build & Test on Merge

on:
  push:
    branches:
      - jdbc  # Triggers only when changes are pushed to the main branch (i.e., after PR merge)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # Other options: 'adopt', 'zulu', etc.
          java-version: '21'

      - name: Grant Execute Permissions for Gradle
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build the Project
        run: ./gradlew build