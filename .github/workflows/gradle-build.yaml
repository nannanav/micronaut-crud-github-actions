name: Gradle Build & Test on Merge

on:
  push:
    branches:
      - main  # Triggers only when changes are pushed to the main branch (i.e., after PR merge)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # Alternative: 'adopt', 'zulu', etc.
          java-version: '17'  # Change this if your project requires a different Java version

      - name: Grant Execute Permissions for Gradle
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build the Project
        run: ./gradlew build